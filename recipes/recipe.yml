# Name of your custom image
name: bazzite-macpro-4070
description: Bazzite NVIDIA Gaming Mode image optimized for the 2019 Mac Pro with an RTX 4070 Super.

# Target the official Bazzite NVIDIA Deck variant for Game Mode
base-image: ghcr.io/ublue-os/bazzite-deck-nvidia
image-version: latest # Pulls the modern nvidia-open kernel modules required for the RTX 4070

modules:
  # 1. Add the T2 Linux COPR repository
  - type: copr
    repo: sharpenedblade/t2linux

  # 2. Install the necessary T2 Mac Pro utility packages
  - type: rpm-ostree
    install:
      - t2linux-audio   # Ensures correct audio mapping via Apple T2
      - t2linux-config  # Overall T2 configuration helper
